[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-extraction-platform"
version = "0.0.1"
description = "Multimodal document-extraction platform: template/content/decoder-mask artifacts, fingerprint-routed fast path, tenant-isolated Postgres backend."
readme = "specs/README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  # moved from dev deps (E04): src/adapters/fingerprint/ needs pypdf at
  # runtime for born-digital fingerprint extraction and verification, not
  # just in tests.
  "pypdf>=4.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff==0.15.21",  # pinned to match .pre-commit-config.yaml's ruff-pre-commit rev
  "mypy>=1.11",
  "pre-commit>=3.8",
  "pip-audit>=2.7",
  "jsonschema>=4.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "N"]

[tool.ruff.lint.isort]
known-first-party = ["domain", "ports", "adapters", "services", "api", "benchmarks"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "epic(id): marks a test as belonging to a specific epic, e.g. epic(\"E04\")",
  "integration: requires a real Postgres database",
  "acceptance: skeleton acceptance criteria mapped to epics (specs/SKELETON-CRITERIA.md)",
  "isolation: tenant-isolation / RLS restricted-role suite (E02)",
]
